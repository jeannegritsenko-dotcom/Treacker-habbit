  :root {
    --bg: #141414;
    --ink: #0d0d0d;
    --paper: #ffffff;
    --muted: #9b8f96;
    --pink-1: #f7d9e8;
    --pink-2: #ec8fbd;
    --pink-3: #dc5a9f;
    --star-soft: rgba(120, 40, 85, .38);
    --font-display: "Mriya Grotesk", "Mriya Grotesk Heavy", "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --font-text: -apple-system, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
  }
  :root[data-theme="light"] { --bg: #141414; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141414; } }
  :root[data-theme="dark"] { --bg: #141414; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
  body {
    background: var(--bg);
    font-family: var(--font-text);
    color: var(--ink);
    overflow: hidden;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  .app {
    position: relative;
    width: 100%;
    max-width: 460px;
    height: 100%;
    padding: 0;
    container-type: inline-size;
  }

  .card {
    position: relative;
    height: 100%;
    border-radius: 0;
    overflow: hidden;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    touch-action: pan-y;
  }

  /* ---------- Верхняя часть с градиентом ---------- */
  .hero {
    position: relative;
    flex: 1 1 60%;
    min-height: 0;
    overflow: hidden;

  }

  .skip {
    position: absolute;
    top: 14px; right: 20px;
    z-index: 5;
    font: 500 17px/1 var(--font-text);
    color: #ffffff;
    background: none;
    border: 0;
    padding: 10px 6px;
    cursor: pointer;
    transition: opacity .25s;
  }
  .skip:focus-visible, .cta:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .skip.hidden { opacity: 0; pointer-events: none; }

  .stars { position: absolute; inset: 0; }
  .star {
    position: absolute;
    fill: var(--star-soft);
    transform-origin: center;
    transition: transform .7s cubic-bezier(.3,.8,.3,1), left .7s cubic-bezier(.3,.8,.3,1), top .7s cubic-bezier(.3,.8,.3,1);
  }
  .star.big { fill: #0d0d0d; }
  .star.tw { animation: twinkle 4.5s ease-in-out infinite; }
  .star.tw.d2 { animation-delay: 1.4s; }
  .star.tw.d3 { animation-delay: 2.7s; }
  @keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) {
    .star.tw { animation: none; }
    .star, .track, .dot, .cta { transition: none !important; }
  }

  /* ---------- Нижняя белая часть ---------- */
  .sheet {
    position: relative;
    flex: 0 0 auto;
    background: var(--paper);
    padding: 30px 4.4cqw 22px;
  }
  .viewport { overflow: hidden; }
  .track {
    display: flex;
    transition: transform .5s cubic-bezier(.3,.8,.3,1);
  }
  .slide { flex: 0 0 100%; }
  h1 {
    margin: 0 0 10px;
    font-family: var(--font-display);
    font-weight: 800;
    font-style: normal;
    font-size: min(8.8cqw, 40px);
    line-height: 1.1;
    letter-spacing: -0.03em;
    color: var(--ink);
    white-space: nowrap;
  }
  /* запасной вариант: Inter Black Italic, пока нет Mriya */
  p {
    margin: 0;
    font-size: min(4.5cqw, 20px);
    line-height: 1.42;
    color: #9b8e95;
    max-width: 66cqw;
    min-height: 4.26em;
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 34px;
    gap: 16px;
  }
  .dots { display: flex; gap: 6px; align-items: center; }
  .dot {
    height: 9px; width: 9px; border-radius: 9px;
    background: #e5e5ea;
    border: 0; padding: 0; cursor: pointer;
    transition: width .35s cubic-bezier(.3,.8,.3,1), background .35s;
  }
  .dot.active { width: 22px; background: var(--ink); }

  .cta {
    flex: 0 0 auto;
    height: 46px;
    min-width: 104px;
    padding: 0 24px;
    border: 0;
    border-radius: 23px;
    background: var(--ink);
    color: #fff;
    font: 600 16px/1 var(--font-text);
    cursor: pointer;
    transition: transform .15s;
  }
  .cta:active { transform: scale(.96); }

  .toast {
    position: absolute;
    left: 50%; bottom: 100px;
    transform: translate(-50%, 20px);
    background: rgba(13,13,13,.92);
    color: #fff;
    padding: 12px 20px;
    border-radius: 18px;
    font-size: 15px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s, transform .3s;
    z-index: 10;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-height: 640px) {
    .sheet { padding-bottom: 14px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="card" id="card">

    <div class="hero" id="hero">
      <button class="skip" id="skip" type="button">Пропустить</button>
      <div class="stars" id="stars" aria-hidden="true"></div>
    </div>

    <div class="sheet">
      <div class="viewport">
        <div class="track" id="track">
          <div class="slide">
            <h1>Трекер привычек</h1>
            <p>Контролируйте и ежедневно улучшайте свои привычки для лучшей жизни</p>
          </div>
          <div class="slide">
            <h1>Серии без пропусков</h1>
            <p>Отмечайте выполнение одним касанием и растите серию день за днём</p>
          </div>
          <div class="slide">
            <h1>Мягкие напоминания</h1>
            <p>Выберите удобное время, и бот напомнит о привычке прямо в Telegram</p>
          </div>
        </div>
      </div>

      <div class="footer">
        <div class="dots" id="dots" role="tablist" aria-label="Шаги знакомства"></div>
        <button class="cta" id="cta" type="button">Далее</button>
      </div>
    </div>

    <div class="toast" id="toast">Дальше откроется главный экран</div>
  </div>
</div>

<script>
(function () {
  var tg = (window.Telegram && window.Telegram.WebApp) || null;
  if (tg) {
    try {
      tg.ready();
      tg.expand();
      tg.setHeaderColor && tg.setHeaderColor("#141414");
      tg.setBackgroundColor && tg.setBackgroundColor("#141414");
      tg.disableVerticalSwipes && tg.disableVerticalSwipes();
    } catch (e) {}
  }
  function haptic(kind) {
    try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(kind || "light"); } catch (e) {}
  }

  var STAR = "M12 0C13.1 7.2 16.8 10.9 24 12C16.8 13.1 13.1 16.8 12 24C10.9 16.8 7.2 13.1 0 12C7.2 10.9 10.9 7.2 12 0Z";

  /* Положение звёзд для каждого экрана: x, y в %, размер в px, поворот */
  /* x, y: центр в % от верхней части, s: размер в cqw (% ширины экрана), o: прозрачность */
  var layouts = [
    [ // экран 1: как на референсе
      { x: 35.8, y: 40.5, s: 25.9, big: true },
      { x: 19.2, y: 21.2, s: 12.1, tw: "" },
      { x: 74.4, y: 15.1, s: 9.5,  o: .65 },
      { x: 85.7, y: 48.0, s: 7.1,  tw: "d2" },
      { x: 19.2, y: 71.1, s: 4.3,  tw: "d3" },
      { x: 77.5, y: 74.1, s: 11.5, tw: "" },
      { x: 69.1, y: 85.5, s: 3.4,  tw: "d2" }
    ],
    [ // экран 2
      { x: 62, y: 46, s: 27, big: true, r: 90 },
      { x: 22, y: 26, s: 9,  tw: "d2" },
      { x: 80, y: 24, s: 13, o: .65 },
      { x: 24, y: 68, s: 11, tw: "d3" },
      { x: 86, y: 66, s: 6,  tw: "" },
      { x: 55, y: 86, s: 5,  tw: "d2" },
      { x: 14, y: 50, s: 4,  tw: "d3" }
    ],
    [ // экран 3
      { x: 45, y: 48, s: 28, big: true, r: 180 },
      { x: 80, y: 30, s: 8,  tw: "" },
      { x: 20, y: 30, s: 11, o: .65 },
      { x: 18, y: 74, s: 6,  tw: "d2" },
      { x: 78, y: 72, s: 12, tw: "" },
      { x: 52, y: 18, s: 5,  tw: "d2" },
      { x: 64, y: 88, s: 6,  tw: "d3" }
    ]
  ];

  var NS = "http://www.w3.org/2000/svg";
  var starsEl = document.getElementById("stars");
  var starNodes = [];
  layouts[0].forEach(function () {
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    var path = document.createElementNS(NS, "path");
    path.setAttribute("d", STAR);
    svg.appendChild(path);
    svg.classList.add("star");
    starsEl.appendChild(svg);
    starNodes.push(svg);
  });

  var hero = document.getElementById("hero");
  var track = document.getElementById("track");
  var dotsEl = document.getElementById("dots");
  var cta = document.getElementById("cta");
  var skip = document.getElementById("skip");
  var toast = document.getElementById("toast");
  var total = layouts.length;
  var index = 0;

  for (var i = 0; i < total; i++) {
    (function (n) {
      var d = document.createElement("button");
      d.className = "dot";
      d.type = "button";
      d.setAttribute("role", "tab");
      d.setAttribute("aria-label", "Шаг " + (n + 1));
      d.addEventListener("click", function () { go(n); });
      dotsEl.appendChild(d);
    })(i);
  }

  function render() {
    var lay = layouts[index];
    starNodes.forEach(function (node, k) {
      var c = lay[k];
      node.style.left = "calc(" + c.x + "% - " + (c.s / 2) + "cqw)";
      node.style.top = "calc(" + c.y + "% - " + (c.s / 2) + "cqw)";
      node.style.width = c.s + "cqw";
      node.style.height = c.s + "cqw";
      node.style.transform = "rotate(" + (c.r || 0) + "deg)";
      node.setAttribute("class", "star" + (c.big ? " big" : "") + (c.tw !== undefined ? " tw " + c.tw : ""));
      node.style.fill = c.o ? "rgba(120,40,85," + c.o + ")" : "";
    });
    track.style.transform = "translateX(" + (-index * 100) + "%)";
    Array.prototype.forEach.call(dotsEl.children, function (d, k) {
      d.classList.toggle("active", k === index);
      d.setAttribute("aria-selected", k === index ? "true" : "false");
    });
    cta.textContent = index === total - 1 ? "Начать" : "Далее";
    skip.classList.toggle("hidden", index === total - 1);
  }

  function go(n) {
    n = Math.max(0, Math.min(total - 1, n));
    if (n !== index) haptic("light");
    index = n;
    render();
  }

  function finish() {
    haptic("medium");
    toast.classList.add("show");
    setTimeout(function () { toast.classList.remove("show"); }, 2200);
  }

  cta.addEventListener("click", function () {
    if (index < total - 1) go(index + 1); else finish();
  });
  skip.addEventListener("click", finish);

  /* Свайп */
  var card = document.getElementById("card");
  var sx = null, sy = null;
  card.addEventListener("pointerdown", function (e) { sx = e.clientX; sy = e.clientY; });
  card.addEventListener("pointerup", function (e) {
    if (sx === null) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    sx = sy = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(index + (dx < 0 ? 1 : -1));
  });
  card.addEventListener("pointercancel", function () { sx = sy = null; });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(index + 1);
    if (e.key === "ArrowLeft") go(index - 1);
  });

  render();
})();
</script>
</body>
</html>
