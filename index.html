  :root {
    --bg: #141414;
    --ink: #0d0d0d;
    --paper: #ffffff;
    --muted: #9b8f96;
    --pink-1: #f7d9e8;
    --pink-2: #ec8fbd;
    --pink-3: #dc5a9f;
    --star-soft: rgba(140, 70, 110, .42);
    --font-display: "Mriya Grotesk", "Mriya Grotesk Heavy", "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --font-text: -apple-system, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
    --gx: 68%; --gy: 46%;
  }
  :root[data-theme="light"] { --bg: #141414; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141414; } }
  :root[data-theme="dark"] { --bg: #141414; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
  body {
    background: var(--bg);
    font-family: var(--font-text);
    color: var(--ink);
    overflow: hidden;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  .app {
    position: relative;
    width: 100%;
    max-width: 460px;
    height: 100%;
    padding: 0;
  }

  .card {
    position: relative;
    height: 100%;
    border-radius: 0;
    overflow: hidden;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    touch-action: pan-y;
  }

  /* ---------- Верхняя часть с градиентом ---------- */
  .hero {
    position: relative;
    flex: 1 1 58%;
    min-height: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at var(--gx) var(--gy),
        #e17ab5 0%, var(--pink-3) 22%, var(--pink-2) 52%, var(--pink-1) 82%, #fff 100%);
    transition: --gx .6s;
  }
  /* белая дымка слева и снизу, как на макете */
  .hero::before {
    content: "";
    position: absolute; inset: 0;
    background:
      linear-gradient(100deg, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 30%),
      linear-gradient(0deg, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 28%);
    pointer-events: none;
  }

  .skip {
    position: absolute;
    top: 16px; right: 20px;
    z-index: 5;
    font: 500 16px/1 var(--font-text);
    color: #ffffff;
    background: none;
    border: 0;
    padding: 10px 6px;
    cursor: pointer;
    transition: opacity .25s;
  }
  .skip:focus-visible, .cta:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .skip.hidden { opacity: 0; pointer-events: none; }

  .stars { position: absolute; inset: 0; }
  .star {
    position: absolute;
    fill: var(--star-soft);
    transform-origin: center;
    transition: transform .7s cubic-bezier(.3,.8,.3,1), left .7s cubic-bezier(.3,.8,.3,1), top .7s cubic-bezier(.3,.8,.3,1);
  }
  .star.big { fill: #0d0d0d; }
  .star.tw { animation: twinkle 4.5s ease-in-out infinite; }
  .star.tw.d2 { animation-delay: 1.4s; }
  .star.tw.d3 { animation-delay: 2.7s; }
  @keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) {
    .star.tw { animation: none; }
    .star, .track, .dot, .cta { transition: none !important; }
  }

  /* ---------- Нижняя белая часть ---------- */
  .sheet {
    position: relative;
    flex: 0 0 auto;
    background: var(--paper);
    padding: 4px 24px 22px;
  }
  .viewport { overflow: hidden; }
  .track {
    display: flex;
    transition: transform .5s cubic-bezier(.3,.8,.3,1);
  }
  .slide { flex: 0 0 100%; padding-right: 12px; }
  h1 {
    margin: 0 0 10px;
    font-family: var(--font-display);
    font-weight: 800;
    font-style: normal;
    font-size: clamp(24px, 7.2vw, 30px);
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--ink);
    white-space: nowrap;
  }
  /* запасной вариант: Inter Black Italic, пока нет Mriya */
  p {
    margin: 0;
    font-size: 16px;
    line-height: 1.42;
    color: var(--muted);
    max-width: 23ch;
    min-height: 4.26em;
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 18px;
    gap: 16px;
  }
  .dots { display: flex; gap: 6px; align-items: center; }
  .dot {
    height: 7px; width: 7px; border-radius: 7px;
    background: #e8e4e7;
    border: 0; padding: 0; cursor: pointer;
    transition: width .35s cubic-bezier(.3,.8,.3,1), background .35s;
  }
  .dot.active { width: 18px; background: var(--ink); }

  .cta {
    flex: 0 0 auto;
    height: 46px;
    min-width: 104px;
    padding: 0 24px;
    border: 0;
    border-radius: 23px;
    background: var(--ink);
    color: #fff;
    font: 600 16px/1 var(--font-text);
    cursor: pointer;
    transition: transform .15s;
  }
  .cta:active { transform: scale(.96); }

  .toast {
    position: absolute;
    left: 50%; bottom: 100px;
    transform: translate(-50%, 20px);
    background: rgba(13,13,13,.92);
    color: #fff;
    padding: 12px 20px;
    border-radius: 18px;
    font-size: 15px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s, transform .3s;
    z-index: 10;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-height: 640px) {
    .sheet { padding-bottom: 14px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="card" id="card">

    <div class="hero" id="hero">
      <button class="skip" id="skip" type="button">Пропустить</button>
      <div class="stars" id="stars" aria-hidden="true"></div>
    </div>

    <div class="sheet">
      <div class="viewport">
        <div class="track" id="track">
          <div class="slide">
            <h1>Трекер привычек</h1>
            <p>Контролируйте и ежедневно улучшайте свои привычки для лучшей жизни</p>
          </div>
          <div class="slide">
            <h1>Серии без пропусков</h1>
            <p>Отмечайте выполнение одним касанием и растите серию день за днём</p>
          </div>
          <div class="slide">
            <h1>Мягкие напоминания</h1>
            <p>Выберите удобное время, и бот напомнит о привычке прямо в Telegram</p>
          </div>
        </div>
      </div>

      <div class="footer">
        <div class="dots" id="dots" role="tablist" aria-label="Шаги знакомства"></div>
        <button class="cta" id="cta" type="button">Далее</button>
      </div>
    </div>

    <div class="toast" id="toast">Дальше откроется главный экран</div>
  </div>
</div>

<script>
(function () {
  var tg = (window.Telegram && window.Telegram.WebApp) || null;
  if (tg) {
    try {
      tg.ready();
      tg.expand();
      tg.setHeaderColor && tg.setHeaderColor("#141414");
      tg.setBackgroundColor && tg.setBackgroundColor("#141414");
      tg.disableVerticalSwipes && tg.disableVerticalSwipes();
    } catch (e) {}
  }
  function haptic(kind) {
    try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(kind || "light"); } catch (e) {}
  }

  var STAR = "M12 0C13.1 7.2 16.8 10.9 24 12C16.8 13.1 13.1 16.8 12 24C10.9 16.8 7.2 13.1 0 12C7.2 10.9 10.9 7.2 12 0Z";

  /* Положение звёзд для каждого экрана: x, y в %, размер в px, поворот */
  var layouts = [
    [ // экран 1, как на макете
      { x: 40, y: 56, s: 110, big: true },
      { x: 27, y: 38, s: 52, tw: "" },
      { x: 71, y: 33, s: 40, dark: true },
      { x: 80, y: 62, s: 30, tw: "d2" },
      { x: 27, y: 80, s: 30, tw: "d3" },
      { x: 73, y: 83, s: 48, tw: "" },
      { x: 67, y: 93, s: 22, tw: "d2" }
    ],
    [ // экран 2
      { x: 58, y: 48, s: 120, big: true, r: 90 },
      { x: 24, y: 30, s: 36, tw: "d2" },
      { x: 76, y: 28, s: 54, tw: "" },
      { x: 30, y: 70, s: 44, tw: "d3" },
      { x: 84, y: 66, s: 28, tw: "" },
      { x: 56, y: 88, s: 26, tw: "d2" },
      { x: 18, y: 54, s: 22, tw: "d3" }
    ],
    [ // экран 3
      { x: 50, y: 52, s: 128, big: true, r: 180 },
      { x: 78, y: 34, s: 34, tw: "" },
      { x: 22, y: 36, s: 46, tw: "d3" },
      { x: 20, y: 76, s: 28, tw: "d2" },
      { x: 76, y: 74, s: 52, tw: "" },
      { x: 48, y: 22, s: 24, tw: "d2" },
      { x: 62, y: 90, s: 28, tw: "d3" }
    ]
  ];
  var glow = [ [68, 46], [34, 52], [60, 38] ];

  var NS = "http://www.w3.org/2000/svg";
  var starsEl = document.getElementById("stars");
  var starNodes = [];
  layouts[0].forEach(function () {
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    var path = document.createElementNS(NS, "path");
    path.setAttribute("d", STAR);
    svg.appendChild(path);
    svg.classList.add("star");
    starsEl.appendChild(svg);
    starNodes.push(svg);
  });

  var hero = document.getElementById("hero");
  var track = document.getElementById("track");
  var dotsEl = document.getElementById("dots");
  var cta = document.getElementById("cta");
  var skip = document.getElementById("skip");
  var toast = document.getElementById("toast");
  var total = layouts.length;
  var index = 0;

  for (var i = 0; i < total; i++) {
    (function (n) {
      var d = document.createElement("button");
      d.className = "dot";
      d.type = "button";
      d.setAttribute("role", "tab");
      d.setAttribute("aria-label", "Шаг " + (n + 1));
      d.addEventListener("click", function () { go(n); });
      dotsEl.appendChild(d);
    })(i);
  }

  function render() {
    var lay = layouts[index];
    starNodes.forEach(function (node, k) {
      var c = lay[k];
      node.style.left = "calc(" + c.x + "% - " + (c.s / 2) + "px)";
      node.style.top = "calc(" + c.y + "% - " + (c.s / 2) + "px)";
      node.style.width = c.s + "px";
      node.style.height = c.s + "px";
      node.style.transform = "rotate(" + (c.r || 0) + "deg)";
      node.setAttribute("class", "star" + (c.big ? " big" : "") + (c.tw !== undefined ? " tw " + c.tw : ""));
      node.style.fill = c.dark ? "rgba(120,40,85,.55)" : "";
    });
    hero.style.setProperty("--gx", glow[index][0] + "%");
    hero.style.setProperty("--gy", glow[index][1] + "%");
    track.style.transform = "translateX(" + (-index * 100) + "%)";
    Array.prototype.forEach.call(dotsEl.children, function (d, k) {
      d.classList.toggle("active", k === index);
      d.setAttribute("aria-selected", k === index ? "true" : "false");
    });
    cta.textContent = index === total - 1 ? "Начать" : "Далее";
    skip.classList.toggle("hidden", index === total - 1);
  }

  function go(n) {
    n = Math.max(0, Math.min(total - 1, n));
    if (n !== index) haptic("light");
    index = n;
    render();
  }

  function finish() {
    haptic("medium");
    toast.classList.add("show");
    setTimeout(function () { toast.classList.remove("show"); }, 2200);
  }

  cta.addEventListener("click", function () {
    if (index < total - 1) go(index + 1); else finish();
  });
  skip.addEventListener("click", finish);

  /* Свайп */
  var card = document.getElementById("card");
  var sx = null, sy = null;
  card.addEventListener("pointerdown", function (e) { sx = e.clientX; sy = e.clientY; });
  card.addEventListener("pointerup", function (e) {
    if (sx === null) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    sx = sy = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(index + (dx < 0 ? 1 : -1));
  });
  card.addEventListener("pointercancel", function () { sx = sy = null; });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(index + 1);
    if (e.key === "ArrowLeft") go(index - 1);
  });

  render();
})();
</script>
</body>
</html>
